name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      pr_sha:
        description: Pull request head SHA
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  request:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Request preview deployment from main
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'pr-preview.yml',
                ref: 'main',
                inputs: {
                  pr_number: String(context.issue.number),
                  pr_sha: context.payload.pull_request.head.sha,
                },
              })
            } catch (error) {
              const bootstrapMissing =
                error.status === 404 ||
                (error.status === 422 && String(error.message).includes("workflow_dispatch"))
              if (bootstrapMissing) {
                core.notice('PR Preview workflow is not installed on main yet; skipping self-preview during bootstrap.')
                return
              }
              throw error
            }

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_sha }}
          path: preview

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: production
        run: npm install

      - name: Build production site
        working-directory: production
        run: npm run build

      - name: Install preview dependencies
        working-directory: preview
        run: npm install

      - name: Build pull request preview
        working-directory: preview
        run: npm run build -- --base /roboeyes-image-editor/pr-preview/pr-${{ inputs.pr_number }}/

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/pr-preview/pr-${{ inputs.pr_number }}
          cp -a production/dist/. site/
          cp -a preview/dist/. site/pr-preview/pr-${{ inputs.pr_number }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pr-preview/pr-${{ inputs.pr_number }}/
    runs-on: ubuntu-latest
    needs: build
    outputs:
      preview_url: ${{ steps.preview-url.outputs.url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set preview URL
        id: preview-url
        run: echo "url=${{ steps.deployment.outputs.page_url }}pr-preview/pr-${{ inputs.pr_number }}/" >> "$GITHUB_OUTPUT"

  comment:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Post preview URL to pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const marker = '<!-- roboeyes-pr-preview -->'
            const body = `${marker}\n✅ **PR Preview**\n\n${process.env.PREVIEW_URL}\n\nThis preview is rebuilt from the latest PR head while the production root remains on \`main\`.`
            const { owner, repo } = context.repo
            const issue_number = Number(process.env.PR_NUMBER)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
